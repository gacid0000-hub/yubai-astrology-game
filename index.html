<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>十二星座圆盘感</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f7f1ff;
  --bg-strong: #eadbff;
  --ink: #2f2440;
  --muted: #786b89;
  --line: rgba(103, 76, 130, 0.18);
  --panel: rgba(255, 255, 255, 0.78);
  --panel-strong: #ffffff;
  --primary: #7b57c7;
  --primary-deep: #55389a;
  --gold: #b88735;
  --good: #2f9b72;
  --bad: #c5506a;
  --shadow: 0 18px 60px rgba(82, 55, 126, 0.18);
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(circle at 20% 12%, rgba(255, 255, 255, 0.9) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.9) 0 1px, transparent 2px),
    radial-gradient(circle at 18% 72%, rgba(255, 255, 255, 0.75) 0 1px, transparent 2px),
    linear-gradient(145deg, #fbf8ff 0%, #efe3ff 42%, #dcc9fa 100%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
}

button {
  font: inherit;
}

.app-shell {
  width: min(100%, 460px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
}

.view {
  display: none;
}

.view-active {
  display: block;
}

.hero,
.chapter-card,
.unlock-card,
.question-card,
.result-card,
.quote-card,
.weakness-card,
.summary-grid > div,
.stats-row > div,
.wheel-panel {
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 20px 22px 22px;
  border-radius: 26px;
}

.kicker,
.label {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
}

.brand-lockup {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.brand-lockup img,
.game-logo {
  flex: 0 0 auto;
  width: 54px;
  height: 54px;
  border: 1px solid rgba(255, 255, 255, 0.62);
  border-radius: 50%;
  object-fit: cover;
  object-position: 50% 47%;
  box-shadow: 0 10px 28px rgba(72, 38, 104, 0.18);
}

.brand-subtitle {
  margin: 4px 0 0;
  color: var(--primary-deep);
  font-size: 13px;
  font-weight: 800;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

.hero h1,
.result-card h1 {
  position: relative;
  margin: 7px 0 22px;
  font-size: 34px;
  line-height: 1.08;
}

.mastery {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 14px;
}

.mastery strong {
  color: var(--primary-deep);
}

.mastery-bar {
  height: 10px;
  margin-top: 9px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(123, 87, 199, 0.12);
}

.mastery-bar span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #a98be6, #7b57c7);
  transition: width 240ms ease;
}

.chapter-card,
.unlock-card,
.weakness-card {
  margin-top: 16px;
  padding: 18px;
  border-radius: 22px;
}

.section-title,
.unlock-card,
.game-top,
.stats-row,
.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.section-title h2,
.unlock-card h2,
.weakness-card h2 {
  margin: 0;
  font-size: 18px;
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}

.level-button {
  min-height: 112px;
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel-strong);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, opacity 160ms ease;
}

.level-button:active {
  transform: scale(0.98);
}

.level-button[disabled] {
  cursor: not-allowed;
  opacity: 0.45;
}

.level-number {
  display: grid;
  width: 30px;
  height: 30px;
  margin-bottom: 8px;
  place-items: center;
  border-radius: 50%;
  background: #efe5ff;
  color: var(--primary-deep);
  font-weight: 800;
}

.level-button strong {
  display: block;
  min-height: 34px;
  font-size: 13px;
  line-height: 1.3;
}

.level-button span {
  display: block;
  margin-top: 8px;
  color: var(--gold);
  font-size: 12px;
}

.unlock-card {
  align-items: center;
}

.unlock-card p:last-child {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}

.lock-badge {
  flex: 0 0 auto;
  padding: 7px 10px;
  border-radius: 999px;
  background: #eee4ff;
  color: var(--primary-deep);
  font-size: 12px;
  font-weight: 800;
}

.icon-button {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.76);
  color: var(--primary-deep);
  font-size: 26px;
  font-weight: 700;
}

.game-top {
  padding: 4px 0 14px;
}

.game-top h2 {
  max-width: 188px;
  margin: 3px 0 0;
  overflow: hidden;
  font-size: 22px;
  line-height: 1.1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.timer {
  display: grid;
  width: 54px;
  height: 54px;
  place-items: center;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  font-size: 22px;
  font-weight: 900;
}

.timer.timer-danger {
  background: #c5506a;
  animation: timerPulse 620ms ease-in-out infinite alternate;
}

@keyframes timerPulse {
  from {
    box-shadow: 0 0 0 0 rgba(197, 80, 106, 0.2);
    transform: scale(1);
  }

  to {
    box-shadow: 0 0 0 8px rgba(197, 80, 106, 0.18);
    transform: scale(1.05);
  }
}

.stats-row {
  margin-bottom: 14px;
}

.stats-row > div,
.summary-grid > div {
  flex: 1;
  padding: 12px 10px;
  border-radius: 16px;
  text-align: center;
}

.stats-row span,
.summary-grid span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.stats-row strong,
.summary-grid strong {
  display: block;
  margin-top: 3px;
  color: var(--primary-deep);
  font-size: 20px;
}

.question-card {
  min-height: 158px;
  padding: 24px 20px;
  border-radius: 24px;
}

.question-card h3 {
  margin: 12px 0 0;
  font-size: clamp(23px, 8vw, 32px);
  line-height: 1.25;
}

.answers {
  display: grid;
  gap: 11px;
  margin-top: 14px;
}

.answer-button {
  min-height: 58px;
  padding: 13px 16px;
  border: 1px solid rgba(85, 56, 154, 0.18);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--ink);
  font-size: 18px;
  font-weight: 800;
  text-align: left;
}

.answer-button.correct {
  border-color: rgba(47, 155, 114, 0.6);
  background: rgba(47, 155, 114, 0.14);
  color: #176447;
}

.answer-button.wrong {
  border-color: rgba(197, 80, 106, 0.62);
  background: rgba(197, 80, 106, 0.13);
  color: #8a2941;
}

.wheel-panel {
  margin-bottom: 14px;
  padding: 14px;
  border-radius: 24px;
}

.is-hidden {
  display: none;
}

.zodiac-wheel {
  position: relative;
  width: min(78vw, 330px);
  height: min(78vw, 330px);
  margin: 0 auto;
  border: 2px solid rgba(123, 87, 199, 0.34);
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255, 255, 255, 0.86) 0 28%, transparent 29%),
    radial-gradient(circle, rgba(255, 255, 255, 0.5), rgba(244, 237, 255, 0.35));
}

.wheel-line {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1px;
  height: 50%;
  background: rgba(123, 87, 199, 0.2);
  transform-origin: 50% 0;
}

.wheel-item {
  position: absolute;
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.86);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  text-align: center;
  transform: translate(-50%, -50%);
}

.wheel-item b {
  display: block;
  color: var(--primary-deep);
  font-size: 16px;
}

.wheel-item.known {
  border-color: rgba(184, 135, 53, 0.75);
  background: #fff7dd;
}

.wheel-item.target {
  border-color: rgba(123, 87, 199, 0.82);
  box-shadow: 0 0 0 5px rgba(123, 87, 199, 0.14);
}

.result-card {
  padding: 28px 22px;
  border-radius: 26px;
  text-align: center;
}

.stars {
  color: var(--gold);
  font-size: 34px;
  letter-spacing: 0;
}

.quote-card {
  margin-top: 16px;
  padding: 18px 20px;
  border-radius: 22px;
  text-align: center;
}

.quote-card p {
  margin: 0;
  color: var(--primary-deep);
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.55;
}

.quote-card span {
  display: block;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.weakness-card p {
  margin: 10px 0 0;
  color: var(--muted);
  line-height: 1.5;
}

.actions {
  margin-top: 16px;
  flex-wrap: wrap;
}

.primary-button,
.secondary-button {
  flex: 1 1 calc(50% - 8px);
  min-height: 50px;
  border-radius: 16px;
  font-weight: 900;
}

.primary-button {
  border: 0;
  background: var(--primary);
  color: white;
}

.secondary-button {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.8);
  color: var(--primary-deep);
}

@media (max-width: 360px) {
  .app-shell {
    padding-left: 12px;
    padding-right: 12px;
  }

  .level-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .actions {
    flex-direction: column;
  }

  .primary-button,
  .secondary-button {
    width: 100%;
  }
}

</style>

let progress = loadProgress();
let session = null;
let timerId = null;

function defaultProgress() {
  return {
    unlocked: levels.length,
    levels: levels.map(() => ({ bestScore: 0, bestStars: 0, bestAccuracy: 0, attempts: 0 })),
    mistakes: [],
  };
}

function loadProgress() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!parsed || !Array.isArray(parsed.levels)) return defaultProgress();
    const fallback = defaultProgress();
    const normalizedLevels = levels.map((_, index) => ({ ...fallback.levels[index], ...(parsed.levels[index] || {}) }));
    return {
      ...fallback,
      ...parsed,
      unlocked: Math.min(parsed.unlocked || fallback.unlocked, levels.length),
      levels: normalizedLevels,
    };
  } catch {
    return defaultProgress();
  }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function showView(view) {
  [els.mapView, els.gameView, els.resultView].forEach((node) => node.classList.remove("view-active"));
  view.classList.add("view-active");
}

function renderMap() {
  els.levelGrid.innerHTML = "";
  levels.forEach((level, index) => {
    const record = progress.levels[index] || {};
    const button = document.createElement("button");
    button.className = "level-button";
    button.type = "button";
    button.disabled = index >= progress.unlocked;
    button.innerHTML = `
      <div class="level-number">${index + 1}</div>
      <strong>${level.title}</strong>
      <span>${stars(record.bestStars || 0)} · ${record.bestScore || 0}</span>
    `;
    button.addEventListener("click", () => startLevel(index));
    els.levelGrid.appendChild(button);
  });

  const mastered = progress.levels.reduce((sum, level) => sum + (level.bestAccuracy || 0), 0) / levels.length;
  const percent = Math.round(mastered);
  els.masteryText.textContent = `${percent}%`;
  els.masteryBar.style.width = `${Math.min(percent, 100)}%`;
  if (percent >= 85) {
    els.futureText.textContent = "已达到解锁线，下一版可以进入解盘表达训练。";
    els.futureBadge.textContent = "READY";
  } else {
    els.futureText.textContent = "第一章整体掌握度达到 85% 后解锁。";
    els.futureBadge.textContent = "LOCK";
  }
}

function startLevel(index, reviewOnly = false) {
  clearInterval(timerId);
  els.timerText.classList.remove("timer-danger");
  const level = levels[index];
  session = {
    levelIndex: index,
    reviewOnly,
    timeLeft: reviewOnly ? 45 : ROUND_SECONDS,
    score: 0,
    correct: 0,
    total: 0,
    streak: 0,
    bestStreak: 0,
    mistakes: [],
    locked: false,
    currentQuestion: null,
    lastQuestionKey: "",
  };
  els.levelLabel.textContent = reviewOnly ? "错题复习" : `第 ${index + 1} 关`;
  els.levelTitle.textContent = reviewOnly ? `${level.title}复习` : level.title;
  showView(els.gameView);
  renderGameStats();
  nextQuestion();
  timerId = setInterval(tick, 1000);
}

function tick() {
  if (!session) return;
  session.timeLeft -= 1;
  renderGameStats();
  if (session.timeLeft <= 0) finishLevel();
}

function nextQuestion() {
  if (!session) return;
  const level = levels[session.levelIndex];
  let question = level.generator(session.levelIndex);
  let tries = 0;
  while (questionKey(question) === session.lastQuestionKey && tries < 12) {
    question = level.generator(session.levelIndex);
    tries += 1;
  }
  session.lastQuestionKey = questionKey(question);
  session.currentQuestion = question;
  els.questionType.textContent = question.type;
  els.questionText.textContent = question.prompt;
  els.answers.innerHTML = "";
  renderWheel(question);
  question.options.forEach((option) => {
    const button = document.createElement("button");
    button.className = "answer-button";
    button.type = "button";
    button.textContent = option;
    button.addEventListener("click", () => answerQuestion(option, button));
    els.answers.appendChild(button);
  });
}

function answerQuestion(answer, button) {
  if (!session || session.locked) return;
  session.locked = true;
  const question = session.currentQuestion;
  const correct = answer === question.answer;
  session.total += 1;
  if (correct) {
    session.correct += 1;
    session.streak += 1;
    session.bestStreak = Math.max(session.bestStreak, session.streak);
    session.score += 100 + Math.min(session.streak, 10) * 12;
    button.classList.add("correct");
  } else {
    session.streak = 0;
    button.classList.add("wrong");
    session.mistakes.push({ ...question, selected: answer });
    [...els.answers.children].forEach((child) => {
      if (child.textContent === question.answer) child.classList.add("correct");
    });
  }
  renderGameStats();
  setTimeout(() => {
    session.locked = false;
    if (session.timeLeft > 0) nextQuestion();
  }, correct ? 260 : 620);
}

function renderGameStats() {
  if (!session) return;
  els.timerText.textContent = session.timeLeft;
  els.timerText.classList.toggle("timer-danger", session.timeLeft <= 10);
  els.scoreText.textContent = session.score;
  els.streakText.textContent = session.streak;
  els.accuracyText.textContent = `${accuracy(session)}%`;
}

function finishLevel() {
  if (!session) return;
  clearInterval(timerId);
  els.timerText.classList.remove("timer-danger");
  const result = { ...session };
  const acc = accuracy(result);
  const passed = result.correct >= 12 && acc >= 75;
  const starCount = acc >= 90 && result.correct >= 18 ? 3 : passed ? 2 : result.correct >= 8 ? 1 : 0;
  const levelRecord = progress.levels[result.levelIndex];
  if (!result.reviewOnly) {
    levelRecord.bestScore = Math.max(levelRecord.bestScore || 0, result.score);
    levelRecord.bestStars = Math.max(levelRecord.bestStars || 0, starCount);
    levelRecord.bestAccuracy = Math.max(levelRecord.bestAccuracy || 0, acc);
    levelRecord.attempts = (levelRecord.attempts || 0) + 1;
    if (passed) progress.unlocked = Math.max(progress.unlocked, Math.min(levels.length, result.levelIndex + 2));
  }
  progress.mistakes.push(...result.mistakes.map((mistake) => ({
    levelIndex: result.levelIndex,
    type: mistake.type,
    prompt: mistake.prompt,
    answer: mistake.answer,
    selected: mistake.selected,
    at: Date.now(),
  })));
  progress.mistakes = progress.mistakes.slice(-80);
  saveProgress();
  renderResult(result, passed, starCount);
  session = null;
  showView(els.resultView);
}

function renderResult(result, passed, starCount) {
  els.resultTitle.textContent = passed || result.reviewOnly ? "本轮观测完成" : "星图仍在展开";
  els.starsText.textContent = stars(starCount);
  const quote = quoteForResult(accuracy(result));
  els.quoteText.textContent = quote.text;
  els.quoteSource.textContent = quote.source;
  els.finalScore.textContent = result.score;
  els.finalAccuracy.textContent = `${accuracy(result)}%`;
  els.finalCorrect.textContent = result.correct;
  els.finalBestStreak.textContent = result.bestStreak;
  els.weaknessText.textContent = summarizeMistakes(result.mistakes);
  els.retryBtn.onclick = () => startLevel(result.levelIndex);
  els.nextBtn.onclick = () => {
    const nextIndex = Math.min(result.levelIndex + 1, levels.length - 1);
    if (nextIndex < progress.unlocked) startLevel(nextIndex);
    else {
      renderMap();
      showView(els.mapView);
    }
  };
  els.reviewBtn.onclick = () => startLevel(result.levelIndex, true);
  els.homeBtn.onclick = () => {
    renderMap();
    showView(els.mapView);
  };
}

function quoteForResult(acc) {
  if (acc >= 90) {
    return pick([
      { text: "日月之行，若出其中；星汉灿烂，若出其里。", source: "曹操《观沧海》" },
      { text: "天行健，君子以自强不息。", source: "《周易》" },
    ]);
  }
  if (acc >= 70) {
    return pick([
      { text: "仰观宇宙之大，俯察品类之盛。", source: "王羲之《兰亭集序》" },
      { text: "人法地，地法天，天法道，道法自然。", source: "老子《道德经》第二十五章" },
    ]);
  }
  if (acc >= 45) {
    return pick([
      { text: "寄蜉蝣于天地，渺沧海之一粟。", source: "苏轼《赤壁赋》" },
      { text: "危楼高百尺，手可摘星辰。", source: "李白《夜宿山寺》" },
    ]);
  }
  return pick(resultQuotes);
}

function renderWheel(question) {
  if (!question.wheel) {
    els.wheelPanel.classList.add("is-hidden");
    els.wheel.innerHTML = "";
    return;
  }
  els.wheelPanel.classList.remove("is-hidden");
  els.wheel.innerHTML = "";
  const radius = 39;
  const wheelSigns = question.wheel.signs;
  for (let line = 0; line < 12; line += 1) {
    const lineEl = document.createElement("span");
    lineEl.className = "wheel-line";
    lineEl.style.transform = `rotate(${90 + line * 30}deg)`;
    els.wheel.appendChild(lineEl);
  }
  for (let house = 1; house <= 12; house += 1) {
    const angle = (195 + (house - 1) * 30) * (Math.PI / 180);
    const item = document.createElement("div");
    item.className = "wheel-item";
    if (house === question.wheel.knownHouse) item.classList.add("known");
    if (house === question.wheel.targetHouse) item.classList.add("target");
    item.style.left = `${50 + Math.cos(angle) * radius}%`;
    item.style.top = `${50 - Math.sin(angle) * radius}%`;
    const signHint = house === question.wheel.knownHouse ? wheelSigns[house - 1].symbol : house === question.wheel.targetHouse ? "?" : "";
    item.innerHTML = `<b>${house}</b>${signHint}`;
    els.wheel.appendChild(item);
  }
}

function summarizeMistakes(mistakes) {
  if (!mistakes.length) return "这关还没有错题。";
  const counts = new Map();
  mistakes.forEach((mistake) => counts.set(mistake.type, (counts.get(mistake.type) || 0) + 1));
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([type, count]) => `${type}错了 ${count} 次`)
    .join("，");
}

function accuracy(source) {
  if (!source.total) return 0;
  return Math.round((source.correct / source.total) * 100);
}

function stars(count) {
  return "★".repeat(count) + "☆".repeat(3 - count);
}

function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function shuffle(list) {
  return [...list].sort(() => Math.random() - 0.5);
}

function mod(index, length = signs.length) {
  return ((index % length) + length) % length;
}

function signByName(name) {
  return signs.find((sign) => sign.name === name);
}

function planetByName(name) {
  return planets.find((planet) => planet.name === name);
}

function maybeSymbolSign(sign, force = false) {
  return force || Math.random() < 0.42 ? sign.symbol : sign.name;
}

function maybeSymbolPlanet(planet, force = false) {
  return force || Math.random() < 0.35 ? planet.symbol : planet.name;
}

function optionsWith(answer, pool, count = 4) {
  const cleanPool = [...new Set(pool)].filter((item) => item !== answer);
  return shuffle([answer, ...shuffle(cleanPool).slice(0, count - 1)]);
}

function questionKey(question) {
  return `${question.type}::${question.prompt}::${question.answer}`;
}

function wrongSignOptions(answer, predicate) {
  return optionsWith(answer, signs.filter((sign) => !predicate(sign)).map((sign) => sign.name));
}

function zodiacCompassQuestion() {
  return pick([sequenceQuestion, oppositeQuestion, houseQuestion, bossQuestion])();
}

function sequenceQuestion() {
  const index = Math.floor(Math.random() * signs.length);
  const direction = Math.random() < 0.5 ? 1 : -1;
  const sign = signs[index];
  const answer = signs[mod(index + direction)].name;
  const promptSign = maybeSymbolSign(sign, Math.random() < 0.3);
  return {
    type: "星座顺序",
    prompt: `${promptSign} 的${direction > 0 ? "下一个" : "上一个"}星座是？`,
    answer,
    options: optionsWith(answer, signs.map((item) => item.name)),
  };
}

function symbolQuestion() {
  const template = pick(["sign", "planet", "aspect", "aspectNature"]);
  if (template === "planet") {
    const planet = pick(planets);
    return {
      type: "符号识别",
      prompt: `${planet.symbol} 是哪颗行星？`,
      answer: planet.name,
      options: optionsWith(planet.name, planets.map((item) => item.name)),
    };
  }
  if (template === "aspect") {
    const aspect = pick(aspects);
    return {
      type: "符号识别",
      prompt: `${aspect.symbol} 是哪个相位？`,
      answer: aspect.name,
      options: optionsWith(aspect.name, aspects.map((item) => item.name)),
    };
  }
  if (template === "aspectNature") {
    const aspect = pick(aspects);
    return {
      type: "相位符号",
      prompt: `${aspect.symbol} 通常是多少度？`,
      answer: aspect.degree,
      options: optionsWith(aspect.degree, aspects.map((item) => item.degree)),
    };
  }
  const sign = pick(signs);
  return {
    type: "符号识别",
    prompt: `${sign.symbol} 是哪个星座？`,
    answer: sign.name,
    options: optionsWith(sign.name, signs.map((item) => item.name)),
  };
}

function natureElementQuestion() {
  return Math.random() < 0.5 ? modeQuestion() : elementQuestion();
}

function modeQuestion() {
  const sign = pick(signs);
  const template = pick(["signToMode", "modeToSign", "modeTrait", "polarity", "polarityTrait"]);
  if (template === "signToMode") {
    return {
      type: "三模式",
      prompt: `${maybeSymbolSign(sign)} 属于哪种模式？`,
      answer: sign.mode,
      options: shuffle(["开创", "固定", "变动", "都不是"]),
    };
  }
  if (template === "modeToSign") {
    const mode = pick(["开创", "固定", "变动"]);
    const answer = pick(signs.filter((item) => item.mode === mode)).name;
    return {
      type: "三模式",
      prompt: `哪个星座属于${mode}模式？`,
      answer,
      options: wrongSignOptions(answer, (item) => item.mode === mode),
    };
  }
  if (template === "modeTrait") {
    const mode = pick(["开创", "固定", "变动"]);
    return {
      type: "三模式特质",
      prompt: `${mode}星座的核心特质是？`,
      answer: modeInfo[mode].trait,
      options: shuffle([modeInfo[mode].trait, ...modeInfo[mode].wrong]),
    };
  }
  if (template === "polarity") {
    return {
      type: "二分法",
      prompt: `${maybeSymbolSign(sign)} 属于阴性还是阳性？`,
      answer: sign.polarity,
      options: shuffle(["阴", "阳", "开创", "固定"]),
    };
  }
  const polarity = pick(["阴", "阳"]);
  return {
    type: "二分法特质",
    prompt: `${polarity}性星座的核心特质是？`,
    answer: polarityInfo[polarity].trait,
    options: shuffle([polarityInfo[polarity].trait, ...polarityInfo[polarity].wrong]),
  };
}

function planetClockQuestion() {
  return pick([planetCycleTemplate, signRhythmTemplate, planetSpeedTemplate])();
}

function planetCycleTemplate() {
  const planet = pick(planets);
  return {
    type: "行星周期",
    prompt: `${maybeSymbolPlanet(planet)} 绕黄道一圈大约需要多久？`,
    answer: planet.cycle,
    options: optionsWith(planet.cycle, planets.map((item) => item.cycle)),
  };
}

function signRhythmTemplate() {
  const planet = pick(planets);
  return {
    type: "换座周期",
    prompt: `${maybeSymbolPlanet(planet)} 平均大约多久换一个星座？`,
    answer: planet.signRhythm,
    options: optionsWith(planet.signRhythm, planets.map((item) => item.signRhythm)),
  };
}

function planetSpeedTemplate() {
  const first = pick(planets);
  let second = pick(planets.filter((planet) => planet.name !== first.name && planet.cycleRank !== first.cycleRank));
  while (!second) second = pick(planets.filter((planet) => planet.name !== first.name));
  const slower = first.cycleRank > second.cycleRank ? first : second;
  return {
    type: "行星快慢",
    prompt: `${maybeSymbolPlanet(first)} 和 ${maybeSymbolPlanet(second)}，哪一颗运行更慢？`,
    answer: slower.name,
    options: optionsWith(slower.name, planets.map((item) => item.name)),
  };
}

function elementQuestion() {
  const sign = pick(signs);
  const template = pick(["signToElement", "elementToSign", "temperament", "elementTrait"]);
  if (template === "signToElement") {
    return {
      type: "四元素",
      prompt: `${maybeSymbolSign(sign)} 属于哪种元素？`,
      answer: sign.element,
      options: shuffle(["火", "土", "风", "水"]),
    };
  }
  if (template === "elementToSign") {
    const element = pick(["火", "土", "风", "水"]);
    const answer = pick(signs.filter((item) => item.element === element)).name;
    return {
      type: "四元素",
      prompt: `哪个星座属于${element}象？`,
      answer,
      options: wrongSignOptions(answer, (item) => item.element === element),
    };
  }
  if (template === "temperament") {
    const element = pick(["火", "土", "风", "水"]);
    return {
      type: "冷热干湿",
      prompt: `${element}象对应哪组冷热干湿？`,
      answer: elementInfo[element].temperament,
      options: shuffle([elementInfo[element].temperament, ...elementInfo[element].wrong]),
    };
  }
  const element = pick(["火", "土", "风", "水"]);
  return {
    type: "元素特质",
    prompt: `${element}象的核心特质是？`,
    answer: elementInfo[element].trait,
    options: optionsWith(elementInfo[element].trait, Object.values(elementInfo).map((item) => item.trait)),
  };
}

function oppositeQuestion() {
  const index = Math.floor(Math.random() * signs.length);
  const sign = signs[index];
  const answer = signs[mod(index + 6)].name;
  return {
    type: "对宫",
    prompt: `${maybeSymbolSign(sign, Math.random() < 0.45)} 的对宫是？`,
    answer,
    options: optionsWith(answer, signs.map((item) => item.name)),
  };
}

function rulerDignityQuestion() {
  const templates = [rulerTemplate, dignityStateTemplate, dignityPlaceTemplate, exaltedPlanetTemplate];
  return pick(templates)();
}

function rulerTemplate() {
  const sign = pick(signs);
  return {
    type: "守护星",
    prompt: `${maybeSymbolSign(sign)} 由哪颗行星守护？`,
    answer: sign.ruler,
    options: optionsWith(sign.ruler, classicalPlanets.map((planet) => planet.name)),
  };
}

function dignityStateTemplate() {
  const planet = pick(classicalPlanets);
  const states = [
    ["入庙", planet.domicile],
    ["入弱", planet.detriment],
    ["入旺", planet.exaltation],
    ["入陷", planet.fall],
  ];
  const [answer, places] = pick(states);
  const sign = signByName(pick(places));
  return {
    type: "庙旺弱陷",
    prompt: `${maybeSymbolPlanet(planet)} 在 ${maybeSymbolSign(sign, true)} 是什么状态？`,
    answer,
    options: shuffle(["入庙", "入旺", "入弱", "入陷"]),
  };
}

function dignityPlaceTemplate() {
  const planet = pick(classicalPlanets);
  const state = pick([
    ["入庙", planet.domicile],
    ["入旺", planet.exaltation],
    ["入弱", planet.detriment],
    ["入陷", planet.fall],
  ]);
  const answer = pick(state[1]);
  return {
    type: "庙旺弱陷",
    prompt: `${maybeSymbolPlanet(planet)} 在哪个星座${state[0]}？`,
    answer,
    options: optionsWith(answer, signs.map((item) => item.name)),
  };
}

function exaltedPlanetTemplate() {
  const candidates = classicalPlanets.filter((planet) => planet.exaltation.length);
  const planet = pick(candidates);
  const signName = pick(planet.exaltation);
  const sign = signByName(signName);
  return {
    type: "庙旺弱陷",
    prompt: `哪颗行星在 ${maybeSymbolSign(sign, true)} 入旺？`,
    answer: planet.name,
    options: optionsWith(planet.name, classicalPlanets.map((item) => item.name)),
  };
}

function receptionQuestion() {
  return Math.random() < 0.58 ? receptionTemplate() : mutualReceptionTemplate();
}

function receptionTemplate() {
  const planet = pick(classicalPlanets);
  const sign = pick(signs);
  return {
    type: "接纳",
    prompt: `${maybeSymbolPlanet(planet)} 落 ${maybeSymbolSign(sign, true)}，按星座守护星由谁接纳？`,
    answer: sign.ruler,
    options: optionsWith(sign.ruler, classicalPlanets.map((item) => item.name)),
  };
}

function mutualReceptionTemplate() {
  const makeTrue = Math.random() < 0.5;
  if (makeTrue) {
    const first = pick(classicalPlanets.filter((planet) => signs.some((sign) => sign.ruler === planet.name)));
    const firstRuled = signs.filter((sign) => sign.ruler === first.name);
    const secondSign = pick(signs.filter((sign) => sign.ruler !== first.name));
    const second = planetByName(secondSign.ruler);
    const firstSign = pick(firstRuled);
    return {
      type: "互融",
      prompt: `${first.name}在${secondSign.name}，${second.name}在${firstSign.name}，是否互融？`,
      answer: "是",
      options: ["是", "不是", "只接纳不互融", "无法判断"],
    };
  }
  let first = pick(classicalPlanets);
  let second = pick(classicalPlanets.filter((planet) => planet.name !== first.name));
  let firstSign = pick(signs);
  let secondSign = pick(signs);
  while (firstSign.ruler === second.name && secondSign.ruler === first.name) {
    first = pick(classicalPlanets);
    second = pick(classicalPlanets.filter((planet) => planet.name !== first.name));
    firstSign = pick(signs);
    secondSign = pick(signs);
  }
  return {
    type: "互融",
    prompt: `${first.name}在${firstSign.name}，${second.name}在${secondSign.name}，是否互融？`,
    answer: "不是",
    options: ["是", "不是", "只接纳不互融", "无法判断"],
  };
}

function houseQuestion() {
  const knownSignIndex = Math.floor(Math.random() * signs.length);
  const knownHouse = Math.floor(Math.random() * 12) + 1;
  const askByHouse = Math.random() < 0.62;
  const wheelSigns = signsForWheel(knownSignIndex, knownHouse);
  if (askByHouse) {
    const targetHouse = Math.floor(Math.random() * 12) + 1;
    const answer = wheelSigns[targetHouse - 1].name;
    return {
      type: "宫位偏移",
      prompt: `${signs[knownSignIndex].name}在 ${knownHouse} 宫，${targetHouse} 宫是什么星座？`,
      answer,
      options: optionsWith(answer, signs.map((item) => item.name)),
    };
  }
  const targetSign = pick(signs);
  const answer = `${wheelSigns.findIndex((item) => item.name === targetSign.name) + 1}宫`;
  return {
    type: "宫位偏移",
    prompt: `${maybeSymbolSign(signs[knownSignIndex])}在 ${knownHouse} 宫，${maybeSymbolSign(targetSign, true)} 落第几宫？`,
    answer,
    options: optionsWith(answer, Array.from({ length: 12 }, (_, index) => `${index + 1}宫`)),
  };
}

function bossQuestion() {
  const knownSignIndex = Math.floor(Math.random() * signs.length);
  const knownHouse = Math.floor(Math.random() * 12) + 1;
  const wheelSigns = signsForWheel(knownSignIndex, knownHouse);
  const targetHouse = randomHouseExcept(knownHouse);
  const answer = wheelSigns[targetHouse - 1].name;
  return {
    type: "圆盘定位",
    prompt: `${signs[knownSignIndex].name}在 ${knownHouse} 宫，? 标记的 ${targetHouse} 宫是什么星座？`,
    answer,
    options: optionsWith(answer, signs.map((item) => item.name)),
    wheel: { signs: wheelSigns, knownHouse, targetHouse },
  };
}

function signsForWheel(knownSignIndex, knownHouse) {
  return Array.from({ length: 12 }, (_, houseIndex) => {
    const offset = houseIndex - (knownHouse - 1);
    return signs[mod(knownSignIndex + offset)];
  });
}

function randomHouseExcept(house) {
  let candidate = Math.floor(Math.random() * 12) + 1;
  while (candidate === house) candidate = Math.floor(Math.random() * 12) + 1;
  return candidate;
}

els.quitBtn.addEventListener("click", () => {
  clearInterval(timerId);
  els.timerText.classList.remove("timer-danger");
  session = null;
  renderMap();
  showView(els.mapView);
});

els.resetProgressBtn.addEventListener("click", () => {
  if (!confirm("要重置 demo 进度吗？")) return;
  progress = defaultProgress();
  saveProgress();
  renderMap();
});

renderMap();

</script>
